name: Windows tests and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.lock
      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from version import VERSION; assert os.environ['RELEASE_TAG'] == 'v'+VERSION, 'Tag/version mismatch'"
      - name: Public source audit
        run: python public_guard.py
      - name: Tests
        timeout-minutes: 5
        run: python -u -m pytest tests -v -o faulthandler_timeout=60
      - name: Build public archive
        run: python release_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/releases/DeadlockWPAOverlay-*-windows-x64.zip
            dist/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath release-artifacts -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one release archive' }
          gh release create "$env:RELEASE_TAG" $archive[0].FullName release-artifacts/SHA256SUMS.txt --verify-tag --title "Deadlock WPA Overlay $env:RELEASE_TAG" --generate-notes --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
